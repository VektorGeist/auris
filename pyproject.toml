[project]
name = "auris"
version = "0.3.0"
description = "A deterministic, model-free sense of hearing (sound -> tonotopic field -> structured text -> episodic memory)"
authors = [{name = "VektorGeist", email = "vektorgeistllc@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["audio", "dsp", "signal-processing", "machine-hearing", "tonotopy", "numpy"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
mic = ["sounddevice"]
images = ["pillow"]

[project.scripts]
auris = "auris.cli:main"

[project.urls]
Homepage = "https://github.com/VektorGeist/auris"
Repository = "https://github.com/VektorGeist/auris"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auris"]
