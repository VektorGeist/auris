name: Bug report
description: Report a defect in the package
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, from pip show auris or auris.__version__
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The input, the command or call, and the output or error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
